<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CERAVO TILES & SURFACES</title>
    <meta
      name="description"
      content="Luxury tiles, bathroom surfaces, and bespoke interiors by CERAVO TILES & SURFACES."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ceravo: {
                taupe: '#5C524A',
                taupeDark: '#413a35',
                stone: '#F3EFE9',
                sand: '#E7DED2',
                ivory: '#F7F4F1',
                brass: '#C8A86E',
                charcoal: '#1F1C1A',
              },
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            },
            boxShadow: {
              luxe: '0 20px 50px rgba(28, 22, 17, 0.18)',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --ceravo-taupe: #5c524a;
        --ceravo-taupe-2: #59514d;
        --ceravo-taupe-3: #736862;
        --ceravo-bg: #f5f0eb;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ceravo-bg);
        font-family: 'Inter', sans-serif;
      }

      .page-shell {
        width: 100%;
        min-height: 100vh;
        background: var(--ceravo-bg);
      }

      .topbar {
        background: var(--ceravo-taupe);
        color: rgba(255,255,255,0.94);
        border-bottom: 1px solid rgba(255,255,255,0.12);
      }

      .brand-mark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.9);
        background: rgba(255,255,255,0.03);
        font-family: 'Cormorant Garamond', serif;
        font-size: 42px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.95);
      }

      .ceravo-wordmark {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .nav-panel {
        background: rgba(109, 97, 90, 0.92);
        border-bottom: 1px solid rgba(255,255,255,0.11);
      }

      .nav-panel .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .nav-item {
        min-height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 18px 20px;
        color: rgba(255,255,255,0.95);
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-right: 1px solid rgba(255,255,255,0.1);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.01);
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .nav-item:nth-child(3n) {
        border-right: none;
      }

      .nav-item:hover,
      .nav-item:active {
        background: rgba(255,255,255,0.06);
        transform: translateY(-1px);
      }

      .nav-item.contact {
        grid-column: 1 / -1;
        min-height: 86px;
        justify-content: flex-start;
        padding-left: 26px;
        border-right: none;
      }

      .content-grid {
        display: grid;
        gap: 16px;
        padding: 24px 16px 32px;
        background: var(--ceravo-bg);
      }

      .info-card {
        background: rgba(255,255,255,0.5);
        border: 1px solid rgba(92,82,74,0.1);
        border-radius: 18px;
        padding: 22px 18px;
        box-shadow: 0 10px 24px rgba(28, 22, 17, 0.04);
      }

      .info-card h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ceravo-taupe);
        font-weight: 700;
      }

      .info-card p {
        margin: 0;
        line-height: 1.7;
        color: rgba(28, 22, 17, 0.8);
      }

      .hero {
        position: relative;
        height: 520px;
        overflow: hidden;
        background-image: linear-gradient(180deg, rgba(28,23,20,0.13), rgba(20,18,16,0.35)),
          url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1600&q=80');
        background-size: cover;
        background-position: center center;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(42, 34, 28, 0.08), rgba(0,0,0,0.12));
      }

      .hero-copy {
        position: absolute;
        left: 50%;
        bottom: 15px;
        transform: translateX(-50%);
        text-align: center;
        color: rgba(255,255,255,0.95);
        z-index: 1;
        width: 100%;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hero-copy span {
        display: inline-block;
        font-size: 15px;
        letter-spacing: 0.2em;
        font-weight: 600;
        text-shadow: 0 2px 14px rgba(0,0,0,0.35);
      }

      .brand-showcase {
        width: 100%;
        min-height: 124px;
        background: #000;
        color: #fff;
        display: grid;
        grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
        align-items: center;
        justify-items: center;
        padding: 0 24px;
      }

      .brand-showcase-name {
        font-family: 'Inter', sans-serif;
        font-size: clamp(10px, 2.7vw, 26px);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }

      .brand-showcase-separator {
        color: rgba(255,255,255,0.9);
        font-size: clamp(15px, 2.4vw, 28px);
        font-weight: 300;
        line-height: 1;
      }

      .action-icon {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.3);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.02);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .top-text {
        font-size: 15px;
        font-weight: 500;
        color: rgba(255,255,255,0.95);
      }

      .top-text-sep {
        opacity: 0.7;
      }

      @media (max-width: 767px) {
        .topbar .header-inner {
          flex-wrap: wrap;
          gap: 12px;
          min-height: auto;
          padding-top: 14px;
          padding-bottom: 14px;
        }

        .header-left,
        .topbar-actions {
          min-width: 0;
          width: 100%;
        }

        .header-left {
          order: 2;
          text-align: center;
        }

        .brand-group {
          order: 1;
          width: 100%;
          justify-content: center;
        }

        .topbar-actions {
          order: 3;
          justify-content: space-between;
          gap: 8px;
        }

        .topbar-actions .search-text,
        .topbar-actions .divider {
          display: none;
        }

        .nav-panel .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .nav-item {
          min-height: 72px;
          padding: 14px 12px;
          font-size: 11px;
          letter-spacing: 0.12em;
        }

        .nav-item:nth-child(2n) {
          border-right: none;
        }

        .nav-item.contact {
          grid-column: 1 / -1;
          min-height: 74px;
          justify-content: center;
          padding-left: 18px;
        }

        .hero {
          height: 360px;
        }

        .content-grid {
          grid-template-columns: 1fr;
          padding-top: 18px;
        }
      }

      @media (max-width: 420px) {
        .brand-mark {
          width: 58px;
          height: 58px;
          font-size: 38px;
        }

        .ceravo-wordmark {
          font-size: clamp(22px, 6vw, 30px);
        }

        .sub-wordmark {
          font-size: 10px;
          letter-spacing: 0.18em;
        }

        .topbar-actions {
          gap: 6px;
        }

        .action-icon {
          width: 30px;
          height: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="header-inner flex items-center justify-between px-4 py-3 md:px-6" style="min-height: 76px;">
          <div class="header-left flex items-center justify-start" style="min-width: 120px;">
            <a href="#" class="top-text" style="font-size: 16px; letter-spacing: 0.02em;">Corporate</a>
          </div>

          <div class="brand-group flex flex-1 items-center justify-center gap-3">
            <div class="brand-mark">C</div>
            <div class="text-center leading-none">
              <div class="ceravo-wordmark" style="font-size: clamp(20px, 4vw, 42px); line-height: 0.9;">CERAVO</div>
              <div class="sub-wordmark" style="margin-top: 5px; font-size: 10px; letter-spacing: 0.28em; font-weight: 500; text-transform: uppercase; color: rgba(255,255,255,0.75);">
                TILES &amp; SURFACES
              </div>
            </div>
          </div>

          <div class="topbar-actions justify-end" style="min-width: 180px;">
            <button type="button" class="top-text search-text" aria-label="Search" style="font-size: 15px; letter-spacing: 0.02em; background: transparent; border: none; color: rgba(255,255,255,0.94);">Search</button>
            <span class="top-text-sep divider" style="font-size: 18px; opacity: 0.75;">|</span>
            <button type="button" class="top-text" aria-label="Where to buy" style="font-size: 15px; letter-spacing: 0.02em; background: transparent; border: none; color: rgba(255,255,255,0.94);">Where to Buy</button>
            <span class="action-icon" aria-label="Language selector" role="button" tabindex="0">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="color: rgba(255,255,255,0.9);">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 110 18 9 9 0 010-18zm0 0c2.5 2.8 3.8 6 3.8 9s-1.3 6.2-3.8 9m0-18C9.5 5.8 8.2 9 8.2 12s1.3 6.2 3.8 9m-7.8-9h15.6M12 3v18"/>
              </svg>
            </span>
            <span class="action-icon" aria-label="Profile" role="button" tabindex="0">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="color: rgba(255,255,255,0.9);">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 19v-1a4 4 0 00-4-4H8a4 4 0 00-4 4v1m14 0v-1a4 4 0 00-3-3.87M13 5a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </span>
          </div>
        </div>
      </header>

      <nav class="nav-panel" aria-label="Main navigation">
        <div class="grid">
          <a href="#" class="nav-item">Tiles</a>
          <a href="#" class="nav-item">Bathware</a>
          <a href="#" class="nav-item">Digital Visualizer</a>
          <a href="#" class="nav-item">Ceravo Solution</a>
          <a href="#" class="nav-item">Downloads</a>
          <a href="#" class="nav-item">Professional</a>
          <a href="#" class="nav-item contact">Contact Us</a>
        </div>
      </nav>

      <main>
        <section class="hero" aria-label="Luxury interior banner">
          <div class="hero-copy">
            <span>Crafted for Elevated Interiors</span>
          </div>
        </section>

        <section class="brand-showcase" aria-label="CERAVO group companies">
          <div class="brand-showcase-name">CERAVO</div>
          <div class="brand-showcase-separator" aria-hidden="true">|</div>
          <div class="brand-showcase-name">SHIS FASHION</div>
          <div class="brand-showcase-separator" aria-hidden="true">|</div>
          <div class="brand-showcase-name">XEROXII</div>
          <div class="brand-showcase-separator" aria-hidden="true">|</div>
          <div class="brand-showcase-name">GHORWA TEA</div>
        </section>
      </main>
    </div>

    <script>
      document.querySelectorAll('.nav-item').forEach((item) => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          document.querySelectorAll('.nav-item').forEach((el) => el.style.background = 'rgba(255,255,255,0.01)');
          item.style.background = 'rgba(255,255,255,0.07)';
        });
      });
    </script>
  </body>
</html>
